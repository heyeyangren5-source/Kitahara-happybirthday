<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#050719">
<title>Happy Birthday Kitahara</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050719;font-family:Arial,Helvetica,sans-serif;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.message{position:fixed;z-index:2;top:15%;left:0;width:100%;padding:0 12px;text-align:center;pointer-events:none}
h1{margin:0;color:#fff;font-size:clamp(30px,8vw,48px);line-height:1.5;font-weight:700;text-shadow:0 0 8px #fff,0 0 22px rgba(255,255,255,.45);animation:glow 2s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.86}to{opacity:1}}
@media(prefers-reduced-motion:reduce){h1{animation:none}}
</style>
</head>
<body>
<canvas id="sky" aria-label="Tap anywhere to launch fireworks"></canvas>
<div class="message"><h1>Happy Birthday<br>Kitahara</h1></div>
<script>
(() => {
  const canvas=document.getElementById("sky"), ctx=canvas.getContext("2d");
  let W=0,H=0,dpr=1,lastTime=0,particles=[],shells=[],stars=[];
  const colors=["#ff4f9a","#ffd166","#65e7ff","#b18cff","#7dffb3","#ffffff","#ff835e"];
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
    canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
    canvas.style.width=W+"px"; canvas.style.height=H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    stars=Array.from({length:Math.min(130,Math.floor(W*H/6500))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.25,a:Math.random()*.55+.2,phase:Math.random()*Math.PI*2}));
    ctx.fillStyle="#050719";ctx.fillRect(0,0,W,H);
  }
  // A glowing firework shell rises from the bottom to the tapped point.
  function launchShell(tx,ty){
    const sx=Math.max(12,Math.min(W-12,tx+(Math.random()-.5)*70));
    shells.push({x:sx,y:H+8,startX:sx,startY:H+8,targetX:tx,targetY:ty,elapsed:0,duration:Math.max(420,Math.min(1050,(H+8-ty)*2.1)),color:colors[Math.floor(Math.random()*colors.length)],trail:[]});
    if(shells.length>30)shells.shift();
  }
  function burst(x,y,color){
    for(let i=0;i<105;i++){
      const a=Math.random()*Math.PI*2,s=Math.random()*5.2+1;
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:Math.random()*.012+.008,size:Math.random()*2.2+.7,color:Math.random()<.14?"#fff":color});
    }
    for(let i=0;i<22;i++){
      const a=Math.random()*Math.PI*2,s=Math.random()*7+2;
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:.025,size:1.8,color:"#fff"});
    }
    if(particles.length>5000)particles.splice(0,particles.length-5000);
  }
  canvas.addEventListener("pointerdown",e=>{
    const r=canvas.getBoundingClientRect();
    launchShell(e.clientX-r.left,Math.max(35,e.clientY-r.top));
  },{passive:true});
  function animate(time){
    const dt=lastTime?Math.min((time-lastTime)/16.67,2):1;lastTime=time;
    ctx.fillStyle="rgba(5,7,25,.22)";ctx.fillRect(0,0,W,H);
    for(const s of stars){
      ctx.globalAlpha=s.a*(.75+.25*Math.sin(time*.0015+s.phase));ctx.fillStyle="#fff";
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    for(let i=shells.length-1;i>=0;i--){
      const s=shells[i];s.elapsed+=16.67*dt;
      const t=Math.min(1,s.elapsed/s.duration), eased=1-Math.pow(1-t,1.35);
      s.x=s.startX+(s.targetX-s.startX)*eased;s.y=s.startY+(s.targetY-s.startY)*eased;
      s.trail.push({x:s.x,y:s.y});if(s.trail.length>12)s.trail.shift();
      for(let j=0;j<s.trail.length;j++){
        const tr=s.trail[j];ctx.globalAlpha=(j+1)/s.trail.length*.65;ctx.fillStyle=s.color;ctx.shadowBlur=10;ctx.shadowColor=s.color;
        ctx.beginPath();ctx.arc(tr.x,tr.y,1.2+(j/s.trail.length)*1.5,0,Math.PI*2);ctx.fill();
      }
      ctx.globalAlpha=1;ctx.fillStyle="#fff";ctx.shadowBlur=16;ctx.shadowColor=s.color;
      ctx.beginPath();ctx.arc(s.x,s.y,2.7,0,Math.PI*2);ctx.fill();
      if(t>=1){burst(s.targetX,s.targetY,s.color);shells.splice(i,1);}
    }
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.985,dt);p.vy=p.vy*Math.pow(.985,dt)+.035*dt;p.life-=p.decay*dt;
      if(p.life<=0){particles.splice(i,1);continue}
      ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.shadowBlur=9;ctx.shadowColor=p.color;
      ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;ctx.shadowBlur=0;requestAnimationFrame(animate);
  }
  addEventListener("resize",resize);resize();requestAnimationFrame(animate);
})();
</script>
</body>
</html>
